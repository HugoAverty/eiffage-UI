<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://play.workadventu.re/iframe_api.js"></script>
    <title>Optimisation de votre expérience - Eiffage</title>
    <style>
        /* Charte Eiffage : Police propre et couleurs officielles */
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            /* Image de fond */
            background-image: url('https://www.eiffage.com/themes/custom/eiffage_theme/logo.svg'); /* Tu peux remplacer par l'URL de ton choix */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .container {
            max-width: 600px;
            padding: 40px;
            border-top: 5px solid #e30613; /* Le rouge Eiffage */
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: rgba(255, 255, 255, 0.9); /* Fond de la popup légèrement transparent */
            border-radius: 5px; /* Optionnel : coins arrondis pour la popup */
        }

        .logo {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 40px;
        }

        /* Bouton fixe en bas */
        .btn-fixe {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #f4f4f4;
            color: #333;
            border: 1px solid #ddd;
            padding: 12px 30px;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-fixe:hover {
            background-color: #e30613;
            color: white;
            border-color: #e30613;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 48 48" height="48" width="48">
                <defs>
                    <linearGradient id="a" x1="3.2173" y1="15" x2="44.7812" y2="15" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="#d93025" />
                        <stop offset="1" stop-color="#ea4335" />
                    </linearGradient>
                    <linearGradient id="b" x1="20.7219" y1="47.6791" x2="41.5039" y2="11.6837" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="#fcc934" />
                        <stop offset="1" stop-color="#fbbc04" />
                    </linearGradient>
                    <linearGradient id="c" x1="26.5981" y1="46.5015" x2="5.8161" y2="10.506" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="#1e8e3e" />
                        <stop offset="1" stop-color="#34a853" />
                    </linearGradient>
                </defs>
                <circle cx="24" cy="23.9947" r="12" style="fill:#fff" />
                <path d="M3.2154,36A24,24,0,1,0,12,3.2154,24,24,0,0,0,3.2154,36ZM34.3923,18A12,12,0,1,1,18,13.6077,12,12,0,0,1,34.3923,18Z" style="fill:none" />
                <path d="M24,12H44.7812a23.9939,23.9939,0,0,0-41.5639.0029L13.6079,30l.0093-.0024A11.9852,11.9852,0,0,1,24,12Z" style="fill:url(#a)" />
                <circle cx="24" cy="24" r="9.5" style="fill:#1a73e8" />
                <path d="M34.3913,30.0029,24.0007,48A23.994,23.994,0,0,0,44.78,12.0031H23.9989l-.0025.0093A11.985,11.985,0,0,1,34.3913,30.0029Z" style="fill:url(#b)" />
                <path d="M13.6086,30.0031,3.218,12.006A23.994,23.994,0,0,0,24.0025,48L34.3931,30.0029l-.0067-.0068a11.9852,11.9852,0,0,1-20.7778.007Z" style="fill:url(#c)" />
            </svg>
        </div>
        
        <h1>Optimisation de navigation</h1>
        
        <p>
            Pour bénéficier d'une expérience fluide et accéder à l'ensemble de nos services interactifs, 
            nous vous recommandons de fermer votre navigateur et d'utiliser le navigateur <strong>Google Chrome</strong>.
        </p>

    </div>

    <button class="btn-fixe" onclick="WA.ui.modal.closeModal();">Ignorer</button>

</body>
</html>
